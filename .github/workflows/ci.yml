name: TikTok Hunter regression tests
on:
  push:
    branches: [fix/video-navigation-and-availability]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check Python and JavaScript syntax
        run: |
          python -m compileall -q app tests
          node --check app/static/app.js
      - name: Run baseline and regression unit tests
        env:
          TTLH_DATA_DIR: ${{ runner.temp }}/tik-tok-hunter-data
        run: python -m unittest discover -s tests -v
